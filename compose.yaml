# TEMPLATE: API-only development stack
# Expects external Temporal server running on localhost:7233
# Start Temporal externally before running: docker compose up

services:
  # Your Workflow API (connects to external Temporal server)
  api:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      # API_AUTH_TOKEN and any other overrides come from here - see README.
      # required: false so `docker compose up`/`compose config` don't fail
      # before `just setup` has created .env from env.template.
      - path: .env
        required: false
    environment:
      - TEMPORAL_HOST=host.docker.internal:7233  # External Temporal server
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=workflow-task-queue
      - TEMPORAL_TLS_MODE=platform
      - API_HOST=0.0.0.0  # Required for Docker containers to accept external connections
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./src:/app/src  # Hot reload for development
      - ./tests:/app/tests
    # TEMPLATE: Add your worker service here if needed
    # command: uv run python -m src.worker

  # TEMPLATE: Add your custom worker services here
  # worker:
  #   build:
  #     context: .
  #   environment:
  #     - TEMPORAL_HOST=localhost:7233  # External Temporal server
  #     - TEMPORAL_NAMESPACE=default
  #     - TEMPORAL_TASK_QUEUE=workflow-task-queue
  #   network_mode: host
  #   command: uv run python -m src.worker